
[shadowrecon]
default_output_dir = results
default_tools = subfinder,assetfinder
enable_http_probe = true
httpx_threads = 50
silent_mode = false

[paths]
subfinder_path = /usr/bin/subfinder
assetfinder_path = /usr/bin/assetfinder
httpx_path = /usr/bin/httpx

[logging]
log_to_file = true
log_file_path = shadowrecon.log
